# Tests, container build and security scans on every push and pull request.
# Snyk runs only when the repository has a SNYK_TOKEN secret (Settings → Secrets and variables → Actions);
# without it those steps are skipped with a notice. No other secret is used.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Devanagari font for PDF export tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - name: "Test suite (offline: fake LLM, fake Supabase Auth, temporary database)"
        run: python -m pytest -o addopts="" -q
      - name: Snyk Open Source and Snyk Code
        if: env.SNYK_TOKEN != ''
        run: |
          npm install -g snyk@1.1308.3
          snyk test --file=requirements.txt --package-manager=pip --command=python --skip-unresolved --fail-on=upgradable --severity-threshold=high
          # Report only: the remaining Snyk Code findings were reviewed as false positives (security-audit triage).
          snyk code test --severity-threshold=high || echo "::warning::Snyk Code reported findings; see the log"
      - name: Snyk skipped
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN is not set, so the Snyk scans were skipped."

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t nyaysutra:ci .
      - name: Start it and check /api/health
        run: |
          # Placeholder values for a throwaway container: single-user mode, no AI calls, no Supabase.
          docker run -d --name app -p 8000:8000 \
            -e AUTH_MODE=local -e APP_PASSWORD=ci-throwaway-only -e OLLAMA_API_KEY=ci-placeholder \
            -e SYNC_ENABLED=false -e REMINDERS_ENABLED=false -e WEB_SEARCH_ENABLED=false \
            nyaysutra:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then echo; break; fi
            sleep 3
          done
          curl -fsS http://localhost:8000/api/health
          echo "user inside the container: $(docker exec app id -un)"
          test "$(docker exec app id -un)" = "nyaya"
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -40 || true
      - name: Save the image for scanning
        run: docker save nyaysutra:ci | gzip -1 > nyaysutra-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nyaysutra-image
          path: nyaysutra-image.tar.gz
          retention-days: 3
      - name: Snyk Container
        if: env.SNYK_TOKEN != ''
        run: |
          npm install -g snyk@1.1308.3
          snyk container test nyaysutra:ci --file=Dockerfile --fail-on=upgradable --severity-threshold=high
